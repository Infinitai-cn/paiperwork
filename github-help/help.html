
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiperwork - Help</title>
    <link rel="stylesheet" href="styles/help.css">
</head> 

<body>
    <div class="help-container">
        <!-- Header with language selector and GitHub link -->
        <div class="help-header">
            <img id="help-logo" class="help-logo" alt="Paiperwork Logo">
            <h1 class="help-title" id="help-main-title">Help & Documentation</h1>
            <div class="header-controls">
                <select id="language-selector" class="language-selector">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="pt">Português</option>
                </select>
                <a href="https://github.com/Infinitai-cn/paiperwork" class="github-link" target="_blank" rel="noopener noreferrer">View on GitHub</a>
            </div>
        </div>

        <div class="help-navigation-wrapper">
            <div class="help-navigation" id="help-navigation">
                <!-- Navigation will be populated dynamically -->
            </div>
            <div class="help-navigation-legend" id="help-navigation-legend">Tab buttons can be scrolled sideways</div>
        </div>

        <div id="help-content-target" class="help-content">
            <p id="loading-message">Loading help content...</p>
        </div>

        <!-- Return button -->
        <button class="close-button" id="close-help">Return</button>
    </div>

    <script>
        // Initialize help content loading flag
        window.helpContentLoaded = false;
    </script>
    
    <!-- Load language system first -->
    <script src="js/lang.js"></script>
    
    <!-- Load help utilities -->
    <script src="js/help.js"></script>
    
    <script>
        // Dynamic content loading based on language
        let currentHelpContentScript = null;

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // Initialize language system and wait for it to complete
                await Lang.initialize();
                
                // Get current language from URL parameter or default
                const urlParams = new URLSearchParams(window.location.search);
                const requestedLanguage = urlParams.get('lang') || Lang.getCurrentLanguage() || 'en';
                
                // Set language selector
                const languageSelector = document.getElementById('language-selector');
                languageSelector.value = requestedLanguage;
                
                // Load appropriate help content file
                loadHelpContentForLanguage(requestedLanguage);
                
                // Setup language selector change handler
            languageSelector.addEventListener('change', async function() {
                const newLanguage = this.value;
                
                try {
                    // Load the new language first
                    await Lang.loadLanguage(newLanguage);
                    Lang.currentLang = newLanguage;
                    
                    // Update URL with language parameter
                    const url = new URL(window.location);
                    url.searchParams.set('lang', newLanguage);
                    window.history.pushState({}, '', url);

                    const helpLegend = document.getElementById('help-navigation-legend');
                    if (helpLegend) {
                        helpLegend.textContent = Lang.get('helpTabsScrollableLegend') || 'Tab buttons can be scrolled sideways';
                    }
                    
                    // Reload content for new language
                    const activeSection = getActiveHelpSection();
                    loadHelpContentForLanguage(newLanguage, { preferredSection: activeSection });
                } catch (error) {
                    console.error('Failed to load language:', newLanguage, error);
                }
            });
            } catch (error) {
                console.error('Failed to initialize language system:', error);
                // Fallback: load English content anyway
                loadHelpContentForLanguage('en');
            }
        });
        
        function getActiveHelpSection() {
            const activeNavItem = document.querySelector('.nav-item.active');
            return activeNavItem ? activeNavItem.getAttribute('data-section') : '';
        }

        function resetHelpContentState() {
            window.helpContentLoaded = false;
            window.helpContent = null;

            if (currentHelpContentScript && currentHelpContentScript.parentNode) {
                currentHelpContentScript.parentNode.removeChild(currentHelpContentScript);
            }
            currentHelpContentScript = null;
        }

        function loadHelpContentForLanguage(language, options = {}) {
            const preferredSection = options && options.preferredSection ? String(options.preferredSection).trim() : '';
            resetHelpContentState();

            const target = document.getElementById('help-content-target');
            if (target) {
                target.innerHTML = '<p id="loading-message">Loading help content...</p>';
            }

            const script = document.createElement('script');
            script.src = `js/help-content-${language}.js`;
            script.dataset.helpContentLanguage = language;
            currentHelpContentScript = script;
            
            script.onload = function() {
                //console.log(`Help content loaded for language: ${language}`);
                window.helpContentLoaded = true;
                initializeHelpPage(preferredSection);
            };
            
            script.onerror = function() {
                console.warn(`Failed to load help content for ${language}, falling back to English`);
                if (language !== 'en') {
                    loadHelpContentForLanguage('en', options);
                } else {
                    console.error('Failed to load English help content');
                    document.getElementById('help-content-target').innerHTML = 
                        '<p>Error loading help content. Please try refreshing the page.</p>';
                }
            };
            
            document.head.appendChild(script);
        }
        
        function initializeHelpPage(preferredSection = '') {
            //console.log("Help page initialized");

            const helpLegend = document.getElementById('help-navigation-legend');
            if (helpLegend && window.Lang) {
                helpLegend.textContent = Lang.get('helpTabsScrollableLegend') || 'Tab buttons can be scrolled sideways';
            }
            
            // Set logo based on theme
            setAppropriateHelpImage();
            
            // Create navigation from content
            createHelpNavigation();
            
            // Setup tab navigation
            setupNavigation();
            
            // Load the preferred section when available, otherwise fall back to the first section.
            const availableSections = Object.keys(window.helpContent || {});
            const initialSection = preferredSection && availableSections.includes(preferredSection)
                ? preferredSection
                : availableSections[0];

            if (initialSection) {
                loadSectionContent(initialSection);
                const initialNavItem = document.querySelector(`.nav-item[data-section="${initialSection}"]`) || document.querySelector('.nav-item');
                if (initialNavItem) {
                    initialNavItem.classList.add('active');
                }
            }
        }
        
        function createHelpNavigation() {
            const navigation = document.getElementById('help-navigation');
            navigation.innerHTML = '';
            
            Object.keys(window.helpContent).forEach(sectionKey => {
                const section = window.helpContent[sectionKey];
                const navItem = document.createElement('div');
                navItem.className = 'nav-item';
                navItem.setAttribute('data-section', sectionKey);
                navItem.innerHTML = `<span>${section.title}</span>`;
                navigation.appendChild(navItem);
            });
        }
    </script>
</body>

</html>
