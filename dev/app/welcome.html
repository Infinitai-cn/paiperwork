<!DOCTYPE html>
<html>

    <head>
        <title id="page-title">Paiperwork- Welcome</title>
        <link rel="stylesheet" href="core/css/themes.css">
        <link rel="stylesheet" href="core/css/styles.css">
        <script src="core/js/libraries/SQLjs/sql-wasm.js"></script>
        <script src="core/js/translations/lang.js"></script>
        <script src="core/js/utils/feats/database.js"></script>
        <script src="core/js/utils/selection.js"></script>
        <script src="core/js/utils/version.js"></script>
        <style>
            /* Background SVG Styles */
            .background-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                overflow: hidden;
            }

            .background-svg {
                width: 100%;
                height: 100%;
            }



            /* Connection lines animation */
            .connection-line {
                stroke-dasharray: 1000;
                stroke-dashoffset: 1000;
                animation: drawLine 8s ease-in-out infinite;
            }

            .connection-line:nth-child(2) {
                animation-delay: -2s;
                animation-duration: 10s;
            }

            .connection-line:nth-child(3) {
                animation-delay: -4s;
                animation-duration: 12s;
            }

            @keyframes drawLine {
                0% {
                    stroke-dashoffset: 1000;
                    opacity: 0;
                }
                10% {
                    opacity: 0.6;
                }
                90% {
                    opacity: 0.6;
                }
                100% {
                    stroke-dashoffset: 0;
                    opacity: 0;
                }
            }

            /* Pulse animation for nodes */
            .node {
                animation: pulse 4s ease-in-out infinite;
            }

            .node:nth-child(2) {
                animation-delay: -1s;
            }

            .node:nth-child(3) {
                animation-delay: -2s;
            }

            .node:nth-child(4) {
                animation-delay: -3s;
            }

            @keyframes pulse {
                0%, 100% {
                    opacity: 0.4;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.8;
                    transform: scale(1.2);
                }
            }

            /* Rotating rings */
            .ring {
                transform-origin: center;
                animation: rotate 30s linear infinite;
            }

            .ring:nth-child(2) {
                animation-duration: 40s;
                animation-direction: reverse;
            }

            .ring:nth-child(3) {
                animation-duration: 50s;
            }

            @keyframes rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }

            /* Top navigation */
            .top-navigation {
                position: absolute;
                top: 15px;
                left: 0;
                right: 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 15px;
                z-index: 10;
            }

            .nav-left {
                flex: 1;
                display: flex;
                justify-content: flex-start;
            }

            .nav-center {
                flex: 1;
                display: flex;
                justify-content: center;
            }

            .nav-right {
                flex: 1;
                display: flex;
                justify-content: flex-end;
            }

            .utility-button {
                padding: 8px 14px !important;
                border-radius: 4px !important;
                border: 1px solid var(--border-color) !important;
                background-color: var(--bg-color) !important;
                color: var(--text-color) !important;
                font-size: 13px !important;
                cursor: pointer !important;
                transition: all 0.2s ease !important;
                width: 180px !important;
                /* Force consistent width */
                min-width: 160px !important;
                max-width: 180px !important;
                white-space: nowrap !important;
                text-align: center !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                box-sizing: border-box !important;
            }

            .utility-button:hover {
                background-color: var(--chart-plot-bg) !important;
            }

            .top-navigation .utility-button.back-button {
                background-color: var(--accent-color) !important;
                color: var(--accent-text) !important;
                border-color: var(--accent-color) !important;
                width: 160px !important;
            }

            .top-navigation .utility-button.back-button:hover {
                background-color: var(--accent-color-hover) !important;
                border-color: var(--accent-color-hover) !important;
            }

            /* Main content */
            .main-content {
                padding-top: 40px;
                /* Add space for the top navigation */
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
                position: relative;
                z-index: 2;
            }

            /* Center the button container horizontally */
            .button-container {
                display: flex;
                justify-content: center;
                gap: 10px;
                width: 100%;
                margin-top: 20px;
            }

            /* Ensure masterkey container is also centered */
            .masterkey-container {
                display: flex;
                flex-direction: column;
                width: 80%;
                max-width: 400px;
                position: relative;
                z-index: 2;
            }

            .password-input-wrapper {
                position: relative;
                display: flex;
                align-items: center;
            }

            .password-toggle {
                position: absolute;
                right: 10px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 5px;
                color: var(--text-muted);
                font-size: 14px;
                z-index: 2;
            }

            .password-toggle:hover {
                color: var(--text-color);
            }

            .masterkey-input {
                padding-right: 40px;
                /* Make room for the toggle button */
            }

            /* Logo glow effect */
            .logo {
                filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
                transition: filter 0.3s ease;
            }

            .logo:hover {
                filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.7));
            }
        </style>
        <script>
            // Helper function for safer element text updates
            function updateElementText(id, langKey) {
                const element = document.getElementById(id);
                if (element) {
                    element.textContent = Lang.get(langKey);
                } else {
                    console.warn(`Element with id '${id}' not found`);
                }
            }

            function setAppropriateImage() {
                const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const logoImg = document.getElementById('logo');
                if (logoImg) {
                    logoImg.src = isDarkMode ? 'core/images/Paiperwork-APP-dark.png' : 'core/images/Paiperwork-APP-light.png';
                }
            }

            // Function to toggle password visibility
            function togglePasswordVisibility() {
                const passwordInput = document.getElementById('masterkey-input');
                const toggleButton = document.getElementById('password-toggle');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleButton.textContent = '👁️‍🗨️'; // Eye with speech bubble (hide)
                    toggleButton.title = Lang.get('hideMasterKey');
                } else {
                    passwordInput.type = 'password';
                    toggleButton.textContent = '👁️'; // Eye (show)
                    toggleButton.title = Lang.get('showMasterKey');
                }
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setAppropriateImage);

            // Initialize language and setup page content
            document.addEventListener('DOMContentLoaded', async function () {
                try {
                    // AWAIT the language initialization
                    await Lang.initialize();

                    // Now update all text content - translations should be available
                    document.title = Lang.get('welcomePageTitle');

                    const masterkeyLabel = document.querySelector('.masterkey-label');
                    if (masterkeyLabel) {
                        masterkeyLabel.textContent = Lang.get('masterkeyInputLabel');
                    }

                    const masterkeyInput = document.getElementById('masterkey-input');
                    if (masterkeyInput) {
                        masterkeyInput.placeholder = Lang.get('masterkeyInput');
                        // Disable autocomplete and password saving
                        masterkeyInput.setAttribute('autocomplete', 'new-password');
                        masterkeyInput.setAttribute('data-lpignore', 'true');
                        masterkeyInput.addEventListener('keydown', function (event) {
                            if (event.key !== 'Enter') {
                                return;
                            }
                            event.preventDefault();
                            const startButton = document.getElementById('Start-button');
                            if (startButton && !startButton.disabled) {
                                startButton.click();
                            }
                        });
                    }

                    // Set up password toggle functionality
                    const passwordToggle = document.getElementById('password-toggle');
                    if (passwordToggle) {
                        passwordToggle.addEventListener('click', togglePasswordVisibility);
                        passwordToggle.title = Lang.get('showMasterKey');
                    }

                    // Set up back button
                    const backButton = document.getElementById('back-button');
                    if (backButton) {
                        backButton.addEventListener('click', function () {
                            window.location.href = 'index.html';
                        });
                    }

                    const helpButton = document.getElementById('help-button');
                    if (helpButton) {
                        helpButton.addEventListener('click', function () {
                            // Open the help page in a new tab instead of a floating window
                            window.open('core/js/help/help.html', '_blank');
                        });
                    }
                    // Set up check for updates button
                    const checkUpdatesButton = document.getElementById('check-updates');
                    if (checkUpdatesButton) {
                        checkUpdatesButton.addEventListener('click', function () {
                            AppVersion.checkForUpdates();
                        });
                    }

                    // Display current version
                    const versionEl = document.getElementById('current-version');
                    if (versionEl && AppVersion) {
                        versionEl.textContent = `v${AppVersion.current}`;
                    }

                    updateElementText('Start-button', 'startButton');
                    updateElementText('help-button', 'helpButton');
                    updateElementText('back-button', 'backButton');
                    updateElementText('check-updates', 'checkUpdatesButton');

                    const logo = document.getElementById('logo');
                    if (logo) {
                        logo.alt = Lang.get('logoAltText');
                    }

                    // Set appropriate image
                    setAppropriateImage();
                } catch (error) {
                    console.error('Error initializing page:', error);
                }
            });
        </script>
    </head>

    <body class="selection-body">
        <!-- Animated SVG Background -->
        <div class="background-container">
            <svg class="background-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <!-- Gradients -->
                    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.3" />
                    </linearGradient>
                    <linearGradient id="gradient2" x1="100%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.5" />
                        <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3" />
                    </linearGradient>
                    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0" />
                    </radialGradient>
                    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0" />
                    </radialGradient>
                    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.5" />
                        <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0" />
                    </radialGradient>

                    <!-- Glow filters -->
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>

                    <!-- Particle glow -->
                    <filter id="particleGlow" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Rotating rings -->
                <g class="ring" filter="url(#glow)">
                    <ellipse cx="50%" cy="50%" rx="400" ry="100" fill="none" stroke="url(#gradient1)" stroke-width="1" opacity="0.3"/>
                </g>
                <g class="ring" filter="url(#glow)">
                    <ellipse cx="50%" cy="50%" rx="450" ry="120" fill="none" stroke="url(#gradient2)" stroke-width="0.5" opacity="0.2"/>
                </g>
                <g class="ring" filter="url(#glow)">
                    <ellipse cx="50%" cy="50%" rx="500" ry="140" fill="none" stroke="url(#gradient1)" stroke-width="0.5" opacity="0.15"/>
                </g>


                <!-- Connection lines -->
                <g stroke="url(#gradient1)" stroke-width="1" opacity="0.4">
                    <line x1="50%" y1="50%" x2="30%" y2="35%" class="connection-line"/>
                    <line x1="50%" y1="50%" x2="70%" y2="35%" class="connection-line"/>
                    <line x1="50%" y1="50%" x2="50%" y2="25%" class="connection-line"/>
                    <line x1="50%" y1="50%" x2="20%" y2="60%" class="connection-line"/>
                    <line x1="50%" y1="50%" x2="80%" y2="60%" class="connection-line"/>
                    <line x1="50%" y1="50%" x2="35%" y2="75%" class="connection-line"/>
                    <line x1="50%" y1="50%" x2="65%" y2="75%" class="connection-line"/>
                    <line x1="50%" y1="50%" x2="50%" y2="85%" class="connection-line"/>
                </g>

                <!-- Additional connection lines for network effect -->
                <g stroke="url(#gradient2)" stroke-width="0.5" opacity="0.3">
                    <line x1="30%" y1="35%" x2="20%" y2="60%" class="connection-line" style="animation-delay: -1s;"/>
                    <line x1="70%" y1="35%" x2="80%" y2="60%" class="connection-line" style="animation-delay: -2s;"/>
                    <line x1="20%" y1="60%" x2="35%" y2="75%" class="connection-line" style="animation-delay: -3s;"/>
                    <line x1="80%" y1="60%" x2="65%" y2="75%" class="connection-line" style="animation-delay: -4s;"/>
                    <line x1="35%" y1="75%" x2="50%" y2="85%" class="connection-line" style="animation-delay: -5s;"/>
                    <line x1="65%" y1="75%" x2="50%" y2="85%" class="connection-line" style="animation-delay: -6s;"/>
                </g>

                <!-- Subtle grid pattern -->
                <defs>
                    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="url(#gradient1)" stroke-width="0.5" opacity="0.1"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)"/>
            </svg>

            <!-- Gradient overlay for better text readability -->
            <div class="gradient-overlay"></div>
        </div>

        <!-- Top navigation bar with utility buttons -->
        <div class="top-navigation">
            <div class="nav-left">
                <button id="back-button" class="utility-button back-button">
                    ← Back
                </button>
            </div>
            <div class="nav-center">
                <!-- center intentionally left empty to keep logo centered -->
            </div>
            <div class="nav-right">
                <button id="check-updates" class="utility-button">
                    Check for Updates
                </button>
            </div>
        </div>

        <!-- Main content -->
        <div class="main-content">
            <img id="logo" class="logo" alt="PaiperworkLogo">
            <div class="masterkey-container">
                <label class="masterkey-label" for="masterkey-input">Master Key</label>
                <div class="password-input-wrapper">
                    <input type="password" class="masterkey-input" id="masterkey-input" placeholder="Enter masterkey..."
                        autocomplete="new-password" data-lpignore="true">
                    <button type="button" id="password-toggle" class="password-toggle" title="Show Master Key"
                        tabindex="-1">👁️</button>
                </div>
            </div>
            <div class="button-container">
                <button id="Start-button" class="selection-button">Start</button>
                <button id="help-button" class="selection-button">Help</button>
            </div>

            <!-- Keep version info centered below main content -->
            <div id="update-status"
                style="text-align: center; margin-top: 10px; display: none; font-size: 14px; color: var(--text-muted);">
            </div>
            <div id="current-version"
                style="text-align: center; margin-top: 10px; font-size: 12px; color: var(--text-muted);">
            </div>
            <div class="tagline-container">
</div>
        </div>
    </body>

</html>
