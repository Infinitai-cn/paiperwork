<!DOCTYPE html>
<html>

    <head>
        <title>Paiperwork - Generation</title>
        <link rel="stylesheet" href="css/themes.css">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/datavizstyles.css">
        <script src="js/libraries/SQLjs/sql-wasm.js"></script>
        <script src="js/libraries/html2canvas/html2canvas.min.js"></script>
        <script src="js/libraries/PDFjs/jspdf.umd.min.js"></script>
        <script type="module">
            import * as pdfjs from './js/libraries/PDFjs/pdf.mjs';

            // Set the global variable
            window.pdfjsLib = pdfjs;

            // Set worker source using the proper API
            try {
                // Modern PDF.js (v3+) uses GlobalWorkerOptions
                if (pdfjs.GlobalWorkerOptions) {
                    pdfjs.GlobalWorkerOptions.workerSrc = './js/libraries/PDFjs/pdf.worker.mjs';
                }
                // Legacy versions might use different approaches
                else if (pdfjs.getDocument) {
                    pdfjs.getDocument.workerSrc = './js/libraries/PDFjs/pdf.worker.mjs';
                }
                //console.log("PDF.js loaded successfully");
            } catch (err) {
                console.error("Error setting PDF.js worker:", err);
            }
        </script>
        <!-- Core functionality that should always be available -->
        <script src="js/utils/database.js"></script>
        <script src="js/translations/lang.js"></script>
        <script src="js/utils/modelparameters.js"></script>
        <script src="js/utils/vram-ram-calculation.js"></script>
        <script src="js/utils/rag.js"></script>
        <script src="js/utils/visualmodels.js"></script>
        <script src="js/utils/thinkingmodels.js"></script>
        <script src="js/utils/ollamahandling.js"></script>
        <script src="js/utils/streamprocessor.js"></script>
        <script src="js/utils/codepreview.js"></script>
        <script src="js/utils/subjectiveinteractions.js"></script>
        <script src="js/utils/securityUtils.js"></script>
        <script src="js/tabs/chattab.js"></script>
        <script src="js/tabs/chat.js"></script>
        <script src="js/tabs/databasetab.js"></script>
        <script src="js/utils/websearch.js"></script>
        <script src="js/utils/export.js"></script>
        <script src="js/utils/tabLoader.js"></script>

        <script src="js/app.js"></script>
    </head>

    <body class="generation-body">
        <div class="main-container">
            <div class="conversation-history-sidebar">
                <div class="app-logo-container">
                    <img id="app-logo" src="images/Paiperwork-APP-light.png" alt="Paiperwork Logo" class="app-logo">
                </div>
                <button id="back-button" class="back-button"
                    onclick="window.location.href='../welcome.html'">Back</button>
                <div class="history-header">
                    <button class="new-conversation-btn">New Chat</button>
                </div>
                <div class="conversation-list" id="conversation-list">
                    <!-- Sessions will be populated here -->
                    <div class="loading-sessions" id="loading-sessions">Loading previous chats...</div>
                </div>
            </div>
            <!-- Chat interface container -->
            <div class="chat-container">
                <div class="progress-bar" id="progress-bar"></div>
                <div class="ai-replies" id="ai-replies"></div>
                <div class="prompt-area">
                    <textarea id="prompt-input" placeholder="Enter your message..."></textarea>
                    <button id="send-prompt">Send</button>
                    <button id="web-search" class="web-button">Web</button>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar right">
                <div class="tab-container">
                    <div class="tab-buttons">
                        <button class="tab-button active" data-tab="chat">Chat</button>
                        <button class="tab-button" data-tab="documents">Documents</button>
                        <button class="tab-button" data-tab="dataviz">DataViz</button>
                        <button class="tab-button" data-tab="paperwork">Paperwork</button>
                        <button class="tab-button" data-tab="research">Research</button>
                        <button class="tab-button" data-tab="artwork">Artwork</button>
                        <button class="tab-button" data-tab="models">Models</button>
                        <button class="tab-button" data-tab="database">Database</button>
                    </div>

                    <div class="tab-content">
                        <!-- Chat Tab -->
                        <div class="tab-pane active" id="chat-tab">
                            <div class="insights-container">
                                <label id="insights-label" class="insights-label">Insights</label>
                                <div class="toggle-switch">
                                    <button class="toggle-option active" data-value="off">OFF</button>
                                    <button class="toggle-option" data-value="on">ON</button>
                                </div>
                            </div>
                            <div class="panel">
                                <div class="label" id="masterkey-label">Master Key: Default</div>
                            </div>
                            <select id="model-selector"></select>
                            <div class="panel">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div class="label" style="margin: 0;">Context size:</div>
                                    <select id="context-selector"></select>
                                </div>
                            </div>
                            <div class="panel" id="context-remaining-panel">
                                <div class="label" id="context-remaining-label">Context remaining: 100%</div>
                            </div>
                            <div class="panel">
                                <div class="label">System prompt</div>
                                <textarea id="system-prompt"></textarea>
                                <button id="save-prompt" disabled>Save</button>
                            </div>
                            <button id="clear-currentsession">Clear current Session</button>
                        </div>

                        <!-- Documents Tab -->
                        <div class="tab-pane" id="documents-tab">
                            <!-- Document content will be dynamically populated by RAG_Utils.js -->
                        </div>
                        <!-- Dataviz Tab -->
                        <div class="tab-pane" id="dataviz-tab">
                            <!-- This will be populated by dataviztab.js -->
                        </div>

                        <div class="tab-pane" id="paperwork-tab">
                            <!-- Content -->
                        </div>
                        <div class="tab-pane" id="research-tab">
                            <div class="loading-placeholder">
                                <p id="loading-research">Loading research tools...</p>
                            </div>
                        </div>
                        <!-- Artwork Tab -->
                        <div class="tab-pane" id="artwork-tab">
                            <!-- Content will be loaded by ArtworksTab.js -->
                            <div class="loading-placeholder">
                                <p id="loading-design">Loading design tools...</p>
                            </div>
                        </div>
                        <!-- Models Tab -->
                        <div class="tab-pane" id="models-tab">
                            <div class="models-container">
                                <!-- Models list will be added by JavaScript -->
                            </div>
                        </div>
                        <div class="tab-pane" id="database-tab">
                            <div class="loading-placeholder">
                                <p id="loading-database">Loading database statistics...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>

            function setAppropriateImage() {
                const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const logoImg = document.getElementById('app-logo');
                if (logoImg) {
                    logoImg.src = isDarkMode ? 'images/Paiperwork-APP-dark.png' : 'images/Paiperwork-APP-light.png';
                }
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setAppropriateImage);

            document.addEventListener('DOMContentLoaded', async function () {
                setAppropriateImage();

                // Initialize language system and WAIT for it to complete
                await Lang.initialize();

                // Update page title directly
                document.title = Lang.get('generationPageTitle');

                // Helper function to safely update element text
                function updateElementText(id, langKey, appendText = '') {
                    const element = document.getElementById(id);
                    if (element) {
                        element.textContent = Lang.get(langKey) + appendText;
                    }
                }

                // Update all text content with error handling
                updateElementText('back-button', 'backButton');

                // Update placeholder with error handling
                const promptInput = document.getElementById('prompt-input');
                if (promptInput) {
                    promptInput.placeholder = Lang.get('enterMessage');
                }
                updateElementText('new-conversation-btn', 'newChatButton');
                updateElementText('send-prompt', 'sendButton');
                updateElementText('web-search', 'webButton');

                // Update tab buttons
                document.querySelectorAll('.tab-button').forEach(button => {
                    const tab = button.getAttribute('data-tab');
                    button.textContent = Lang.get(tab + 'Tab');
                });

                // Fix toggle switches translation
                document.querySelectorAll('.toggle-option').forEach(button => {
                    const value = button.getAttribute('data-value');
                    if (value === 'on') {
                        button.textContent = Lang.get('toggleOn');
                    } else if (value === 'off') {
                        button.textContent = Lang.get('toggleOff');
                    }
                });

                updateElementText('insights-label', 'insightsLabel');
                updateElementText('masterkey-label', 'masterkeyLabel', 'Default');

                // Update context size label
                const contextSizeLabel = document.querySelector('.panel div div.label');
                if (contextSizeLabel) {
                    contextSizeLabel.textContent = Lang.get('contextSizeLabel');
                }

                updateElementText('context-remaining-label', 'contextRemainingLabel', '100%');

                // Update system prompt label - more specific targeting
                const systemPromptLabels = document.querySelectorAll('.panel .label');
                systemPromptLabels.forEach(label => {
                    if (label.textContent.trim() === 'System prompt') {
                        label.textContent = Lang.get('systemPromptLabel');
                    }
                });

                updateElementText('save-prompt', 'saveButton');
                updateElementText('clear-currentsession', 'clearCurrentSession');
                updateElementText('loading-sessions', 'loadingPreviousChats');
                updateElementText('loading-research', 'loadingResearchTools');
                updateElementText('loading-design', 'loadingDesignTools');
                updateElementText('loading-database', 'loadingDatabaseStats');
            });
        </script>
    </body>

</html>
