<!DOCTYPE html>
<html>
<head>
    <title>Paiperwork - Local AI Interface</title>
    <link rel="stylesheet" href="core/css/themes.css">
    <link rel="stylesheet" href="core/css/styles.css">
    <script src="core/js/translations/lang.js"></script>
    <style>
        .landing-container {
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        
        .main-content {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }
        
        .feature-list {
            text-align: left;
            flex: 1;
            padding-right: 40px;
        }
        
        .center-content {
            flex: 1;
            text-align: center;
        }
        
        .how-it-works {
            flex: 1;
            text-align: left;
            padding-left: 40px;
        }
        
        .run-local-button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: rgb(253,148,7);
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px 0;
        }
        
        .top-navigation {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }
        
        .language-selector-container {
            text-align: center;
            margin-top: 20px;
        }
        
        .language-selector-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-color);
        }
        
        #language-selector {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 13px;
            cursor: pointer;
            min-width: 120px;
        }
    </style>
<script>
    function isHostedMode() {
        const host = String(window.location.hostname || '').toLowerCase();
        const protocol = String(window.location.protocol || '').toLowerCase();
        const isLocalHost = host === 'localhost' || host === '127.0.0.1';
        const queryFlag = new URLSearchParams(window.location.search || '').get('cloudOnly');
        const cloudOnlyByQuery = queryFlag === '1' || queryFlag === 'true';
        let cloudOnlyByStorage = false;
        try {
            cloudOnlyByStorage = localStorage.getItem('cloudOnlyMode') === 'true';
        } catch (_err) {
            cloudOnlyByStorage = false;
        }
        return cloudOnlyByQuery || cloudOnlyByStorage || (!isLocalHost && protocol !== 'file:');
    }

    function getHostedRequirementsText(lang) {
        const notices = {
            en: 'Online Paiperwork version requires one API key from <a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">ollama.com</a> to operate free Ollama cloud models, create an Ollama account, create one API key in settings>keys and store in your computer, input the key when Paiperwork requires it.',
            zh: '在线版 Paiperwork 需要一个来自 <a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">ollama.com</a> 的 API Key 才能使用免费的 Ollama 云模型。请创建 Ollama 账户，在 settings>keys 中创建一个 API Key 并保存在您的电脑上，在 Paiperwork 提示时输入该密钥。',
            es: 'La versión online de Paiperwork requiere una clave API de <a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">ollama.com</a> para operar modelos cloud gratuitos de Ollama, crea una cuenta de Ollama, crea una clave API en settings>keys y guárdala en tu ordenador, introduce la clave cuando Paiperwork la solicite.',
            fr: 'La version en ligne de Paiperwork nécessite une clé API depuis <a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">ollama.com</a> pour utiliser les modèles cloud gratuits d\'Ollama, créez un compte Ollama, créez une clé API dans settings>keys et stockez-la sur votre ordinateur, saisissez la clé lorsque Paiperwork la demande.',
            de: 'Die Online-Version von Paiperwork benötigt einen API-Schlüssel von <a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">ollama.com</a>, um kostenlose Ollama-Cloud-Modelle zu nutzen, erstellen Sie ein Ollama-Konto, erstellen Sie einen API-Schlüssel in settings>keys und speichern Sie ihn auf Ihrem Computer, geben Sie den Schlüssel ein, wenn Paiperwork danach fragt.',
            pt: 'A versão online do Paiperwork requer uma chave de API da <a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">ollama.com</a> para operar modelos cloud gratuitos da Ollama, crie uma conta Ollama, crie uma chave de API em settings>keys e guarde-a no seu computador, informe a chave quando o Paiperwork solicitar.'
        };

        return notices[lang] || notices.en;
    }

    function setAppropriateImage() {
        const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const logoImg = document.getElementById('logo');
        logoImg.src = isDarkMode ? 'core/images/Paiperwork-APP-dark.png' : 'core/images/Paiperwork-APP-light.png';
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setAppropriateImage);
    
    document.addEventListener('DOMContentLoaded', async function() {
        // Initialize language system and WAIT for it to complete
        await Lang.initialize();
        
        // Set up language selector
        const languageSelector = document.getElementById('language-selector');
        if (languageSelector) {
            // Set current language as selected
            languageSelector.value = Lang.getCurrentLanguage();
            
            // Add change event listener (make this async too)
            languageSelector.addEventListener('change', async function() {
                await Lang.setLanguage(this.value);
                updatePageText();
            });
        }
        
        // Initial page text update - now happens AFTER language initialization
        updatePageText();

        setAppropriateImage();
    });
    
    function updatePageText() {
        // Update page title
        document.title = Lang.get('indexPageTitle') || 'Paiperwork - Local AI Interface';
        
        // Update main heading
        const mainHeading = document.querySelector('h1');
        if (mainHeading) {
            mainHeading.textContent = Lang.get('mainHeading') || 'Secure WebUi Interface for Ollama';
        }
        
        // Update requirements section
        const requirementsHeading = document.querySelector('.requirements h2');
        if (requirementsHeading) {
            requirementsHeading.textContent = Lang.get('requirementsHeading') || 'Requirements:';
        }
        
        // Update requirements text while preserving the Ollama link
        const requirementsText = document.querySelector('.requirements p');
        if (requirementsText) {
            if (isHostedMode()) {
                requirementsText.innerHTML = getHostedRequirementsText(Lang.getCurrentLanguage());
            } else {
                const translatedText = Lang.get('requirementsText') || 'must be installed and running locally on its (default) port 11434, make sure you have updated to the latest version.';
                const ollamaLinkText = Lang.get('ollamaLinkText') || 'Ollama';
                requirementsText.innerHTML = `<a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">${ollamaLinkText}</a> ${translatedText}`;
            }
        }
        
        // Update start button
        const startButton = document.querySelector('.run-local-button');
        if (startButton) {
            startButton.textContent = Lang.get('startButtonIndex') || 'Start';
        }
        
        // Update language selector label
        const languageLabel = document.querySelector('.language-selector-container label');
        if (languageLabel) {
            languageLabel.textContent = Lang.get('languageSelectorLabel') || 'Language:';
        }
    }
</script>
</head>
<body>
    <div class="landing-container">
        <img id="logo" class="logo" alt="Paiperwork Logo">
        <h1>Secure WebUi Interface for Ollama</h1>
        
        <div class="main-content">
            <div class="center-content">
                <div class="requirements">
                    <h2>Requirements:</h2>
                    <p><a href="https://ollama.com" target="_blank" style="color: var(--link-color, #0078d4); text-decoration: underline;">Ollama</a> must be installed and running locally on it's (default) port 11434, make sure you have updated to the latest version.</p>
                </div>

                <button onclick="window.location.href='welcome.html'" class="run-local-button">Start</button>
                
                <!-- Language selector moved below start button -->
                <div class="language-selector-container">
                    <label for="language-selector">Language:</label>
                    <select id="language-selector">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="zh">中文</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="pt">Português</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
