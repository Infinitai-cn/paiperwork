<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Music Genre Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        
        .source-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .source-btn {
            padding: 10px 20px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .source-btn.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .search-box input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        
        .search-box button {
            padding: 15px 30px;
            background: #00d4ff;
            border: none;
            border-radius: 30px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-box button:hover {
            background: #00b8e6;
            transform: scale(1.05);
        }
        
        .search-box button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            display: none;
        }
        
        .status.loading {
            display: block;
            color: #00d4ff;
        }
        
        .status.error {
            display: block;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        
        .status.success {
            display: block;
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
        }
        
        .music-list {
            display: grid;
            gap: 15px;
        }
        
        .music-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .music-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00d4ff;
            transform: translateX(5px);
        }
        
        .music-item.playing {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }
        
        .play-icon {
            width: 40px;
            height: 40px;
            background: #00d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 12px solid #1a1a2e;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            margin-left: 4px;
        }
        
        .music-item.playing .play-icon::after {
            border-left: 5px solid #1a1a2e;
            border-right: 5px solid #1a1a2e;
            border-top: 0;
            border-bottom: 0;
            margin-left: 0;
            width: 5px;
            height: 12px;
            background: transparent;
        }
        
        .music-info {
            flex: 1;
            min-width: 0;
        }
        
        .music-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .music-artist {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .music-duration {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
        }
        
        .audio-player {
            width: 100%;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: none;
        }
        
        .audio-player.active {
            display: block;
        }
        
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #00d4ff;
            width: 0;
            transition: width 0.1s linear;
        }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .control-btn.play-pause {
            width: 60px;
            height: 60px;
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .control-btn.play-pause:hover {
            background: #00b8e6;
            transform: scale(1.1);
        }
        
        .time-display {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            min-width: 100px;
            text-align: center;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        @media (max-width: 600px) {
            .controls {
                flex-wrap: wrap;
            }
            
            .time-display {
                order: 1;
                width: 100%;
                margin-top: 10px;
            }
            
            .volume-control {
                order: 2;
                width: 100%;
                justify-content: center;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Free Music Genre Player</h1>
        
        <div class="source-toggle">
            <button class="source-btn active" data-source="jamendo">Jamendo Music</button>
            <button class="source-btn" data-source="archive">Internet Archive</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="genreInput" placeholder="Enter genre (e.g., jazz, electronic, rock, classical)...">
            <button id="searchBtn">Search</button>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="music-list" id="musicList"></div>
        
        <div class="audio-player" id="audioPlayer">
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="controls">
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
                </div>
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn play-pause" id="playPauseBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                </div>
            </div>
        </div>
    </div>
    
    <audio id="audio" crossorigin="anonymous"></audio>
    
    <script>
        // Jamendo API - Free music API for creative commons
        const JAMENDO_API_KEY = 'f2d0b3e4'; // Demo key - replace with your own from jamendo.com/api
        
        // CORS Proxies to try (in order of preference)
        const CORS_PROXIES = [
            { url: (target) => `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`, name: 'allorigins' },
            { url: (target) => `https://corsproxy.io/?${encodeURIComponent(target)}`, name: 'corsproxy' },
            { url: (target) => `https://cors.sh/${target}`, name: 'cors.sh' }
        ];
        
        // State
        let currentSource = 'jamendo';
        let playlist = [];
        let currentTrackIndex = -1;
        let isPlaying = false;
        
        // DOM Elements
        const audio = document.getElementById('audio');
        const genreInput = document.getElementById('genreInput');
        const searchBtn = document.getElementById('searchBtn');
        const musicList = document.getElementById('musicList');
        const status = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const sourceBtns = document.querySelectorAll('.source-btn');
        
        // Initialize
        function init() {
            audio.volume = 0.7;
            
            // Source toggle
            sourceBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    sourceBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSource = btn.dataset.source;
                });
            });
            
            // Search
            searchBtn.addEventListener('click', searchMusic);
            genreInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchMusic();
            });
            
            // Audio controls
            playPauseBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', playPrevious);
            nextBtn.addEventListener('click', playNext);
            volumeSlider.addEventListener('input', (e) => {
                audio.volume = e.target.value;
            });
            
            // Progress bar
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => {
                totalTimeEl.textContent = formatTime(audio.duration);
            });
            progressContainer.addEventListener('click', seek);
            
            // When track ends
            audio.addEventListener('ended', () => {
                playNext();
            });
            
            // When track can't play
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                showStatus('Error playing track. Trying next...', 'error');
                setTimeout(playNext, 1500);
            });
        }
        
        // Search music based on source
        async function searchMusic() {
            const genre = genreInput.value.trim();
            if (!genre) {
                showStatus('Please enter a genre', 'error');
                return;
            }
            
            showStatus('Searching for ' + genre + ' music...', 'loading');
            searchBtn.disabled = true;
            
            try {
                if (currentSource === 'jamendo') {
                    await searchJamendo(genre);
                } else {
                    await searchArchive(genre);
                }
            } catch (error) {
                console.error('Search error:', error);
                showStatus('Search failed. Please try again.', 'error');
            }
            
            searchBtn.disabled = false;
        }
        
        // Search Jamendo API (requires API key but has good free music)
        async function searchJamendo(genre) {
            // Jamendo API endpoint
            const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_API_KEY}&format=json&limit=20&tags=${encodeURIComponent(genre)}&fuzzytags=on&audioformat=mp32`;
            
            try {
                // Try direct API call first (Jamendo often allows direct access)
                let response = await fetch(url);
                let data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    processJamendoResults(data.results);
                } else {
                    throw new Error('No results');
                }
            } catch (error) {
                console.log('Direct API failed, trying CORS proxy...');
                // Try with CORS proxy
                let success = false;
                for (const proxy of CORS_PROXIES) {
                    try {
                        const proxyUrl = proxy.url(url);
                        const response = await fetch(proxyUrl);
                        if (response.ok) {
                            const data = await response.json();
                            if (data.results && data.results.length > 0) {
                                processJamendoResults(data.results);
                                success = true;
                                break;
                            }
                        }
                    } catch (e) {
                        console.log(`${proxy.name} failed, trying next...`);
                    }
                }
                
                if (!success) {
                    // Use sample data as fallback
                    useSampleData(genre);
                }
            }
        }
        
        // Process Jamendo results
        function processJamendoResults(tracks) {
            playlist = tracks.map((track, index) => ({
                id: track.id,
                title: track.name,
                artist: track.artist_name,
                duration: track.duration,
                audioUrl: track.audio,
                imageUrl: track.album_image || 'https://via.placeholder.com/50'
            }));
            
            displayPlaylist();
            showStatus(`Found ${playlist.length} tracks!`, 'success');
        }
        
        // Search Internet Archive
        async function searchArchive(genre) {
            const searchUrl = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(genre)}+AND+format:(mp3)&fl[]=identifier,title,creator,downloads&sort[]=downloads+desc&rows=20&output=json`;
            
            let success = false;
            
            // Try direct first
            try {
                const response = await fetch(searchUrl);
                if (response.ok) {
                    const data = await response.response.json();
                    processArchiveResults(data.response.docs);
                    success = true;
                }
            } catch (e) {
                console.log('Direct failed');
            }
            
            // Try CORS proxies
            if (!success) {
                for (const proxy of CORS_PROXIES) {
                    try {
                        const proxyUrl = proxy.url(searchUrl);
                        const response = await fetch(proxyUrl);
                        if (response.ok) {
                            const data = await response.json();
                            processArchiveResults(data.response.docs);
                            success = true;
                            break;
                        }
                    } catch (e) {
                        console.log(`${proxy.name} failed`);
                    }
                }
            }
            
            if (!success) {
                useSampleData(genre);
            }
        }
        
        // Process Archive.org results
        function processArchiveResults(docs) {
            playlist = docs.map((doc, index) => ({
                id: doc.identifier,
                title: doc.title,
                artist: doc.creator || 'Unknown Artist',
                duration: 180, // Default, as Archive doesn't always provide duration
                audioUrl: `https://archive.org/download/${doc.identifier}/${doc.identifier}.mp3`,
                imageUrl: `https://archive.org/services/img/${doc.identifier}`
            }));
            
            displayPlaylist();
            showStatus(`Found ${playlist.length} tracks from Internet Archive!`, 'success');
        }
        
        // Use sample data as fallback (for demo purposes)
        function useSampleData(genre) {
            showStatus('Using demo tracks. API unavailable.', 'loading');
            
            // Demo tracks - these are placeholder URLs
            playlist = [
                {
                    id: 1,
                    title: `${genre.charAt(0).toUpperCase() + genre.slice(1)} Music Sample 1`,
                    artist: 'Demo Artist',
                    duration: 180,
                    audioUrl: '',
                    isDemo: true
                },
                {
                    id: 2,
                    title: `${genre.charAt(0).toUpperCase() + genre.slice(1)} Music Sample 2`,
                    artist: 'Demo Artist',
                    duration: 210,
                    audioUrl: '',
                    isDemo: true
                },
                {
                    id: 3,
                    title: `${genre.charAt(0).toUpperCase() + genre.slice(1)} Music Sample 3`,
                    artist: 'Demo Artist',
                    duration: 195,
                    audioUrl: '',
                    isDemo: true
                }
            ];
            
            displayPlaylist();
            showStatus('Demo mode - API limits reached', 'loading');
        }
        
        // Display playlist
        function displayPlaylist() {
            musicList.innerHTML = '';
            
            if (playlist.length === 0) {
                musicList.innerHTML = '<div class="no-results">No tracks found. Try a different genre.</div>';
                return;
            }
            
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'music-item';
                item.dataset.index = index;
                
                item.innerHTML = `
                    <div class="play-icon"></div>
                    <div class="music-info">
                        <div class="music-title">${track.title}</div>
                        <div class="music-artist">${track.artist}</div>
                    </div>
                    <div class="music-duration">${formatTime(track.duration)}</div>
                `;
                
                item.addEventListener('click', () => playTrack(index));
                musicList.appendChild(item);
            });
        }
        
        // Play track
        async function playTrack(index) {
            const track = playlist[index];
            currentTrackIndex = index;
            
            // Update UI
            document.querySelectorAll('.music-item').forEach((item, i) => {
                item.classList.toggle('playing', i === index);
            });
            
            if (track.isDemo) {
                showStatus('This is a demo track. API unavailable for actual playback.', 'error');
                audio.pause();
                isPlaying = false;
                updatePlayButton();
                return;
            }
            
            audio.src = track.audioUrl;
            audioPlayer.classList.add('active');
            
            try {
                await audio.play();
                isPlaying = true;
                updatePlayButton();
                showStatus(`Playing: ${track.title}`, 'success');
            } catch (error) {
                console.error('Playback error:', error);
                showStatus('Error playing track. The source may have CORS restrictions.', 'error');
            }
        }
        
        // Toggle play/pause
        function togglePlayPause() {
            if (currentTrackIndex === -1 && playlist.length > 0) {
                playTrack(0);
                return;
            }
            
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
            isPlaying = !isPlaying;
            updatePlayButton();
        }
        
        // Update play button icon
        function updatePlayButton() {
            playPauseBtn.textContent = isPlaying ? '⏸' : '▶';
        }
        
        // Play next track
        function playNext() {
            if (playlist.length === 0) return;
            const nextIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(nextIndex);
        }
        
        // Play previous track
        function playPrevious() {
            if (playlist.length === 0) return;
            const prevIndex = currentTrackIndex <= 0 ? playlist.length - 1 : currentTrackIndex - 1;
            playTrack(prevIndex);
        }
        
        // Update progress bar
        function updateProgress() {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        }
        
        // Seek to position
        function seek(e) {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }
        
        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Show status message
        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
        }
        
        // Initialize when DOM is ready
        init();
    </script>
</body>
</html>
